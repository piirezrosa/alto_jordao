; Ajustes do PHP no contêiner (carregado depois do php.ini-production)
date.timezone = America/Sao_Paulo
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
session.cookie_httponly = 1
; Cookie só por HTTPS: ligado em produção com SESSION_COOKIE_SECURE=1 (vazio = desligado, p.ex. teste em http://localhost)
session.cookie_secure = ${SESSION_COOKIE_SECURE}
session.gc_maxlifetime = 7200
session.use_only_cookies = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
