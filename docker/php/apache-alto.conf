# Atrás do Caddy (HTTPS): enxerga o IP real do visitante e sabe que a conexão original era HTTPS
ServerTokens Prod
ServerSignature Off
<IfModule mod_remoteip.c>
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16
</IfModule>
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Nada de arquivos de dados/logs/scripts de banco servidos pelo site
<FilesMatch "(^\.env.*|\.(sql|log|ajenc|md|sh|ini|bak))$">
    Require all denied
</FilesMatch>
